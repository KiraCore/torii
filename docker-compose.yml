services:
  sekai_bridge_node1:
    build:
      context: ./sekai_bridge
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8885:8885"
      - "8886:8886"
      - "9000:9000"
    volumes:
      - ./sekai_bridge/config.yml:/app/config.yml
      - ./sekai_bridge/key.json:/app/key.json
  sekai_bridge_node2:
    build:
      context: ./sekai_bridge
      dockerfile: Dockerfile
    depends_on:
      - sekai_bridge_node1
    ports:
      - "8081:8081"
      - "8887:8887"
      - "8888:8888"
    volumes:
      - ./sekai_bridge/config2.yml:/app/config.yml
      - ./sekai_bridge/key2.json:/app/key.json
  sekai_bridge_node3:
    build:
      context: ./sekai_bridge
      dockerfile: Dockerfile
    depends_on:
      - sekai_bridge_node1
    ports:
      - "8082:8082"
      - "8889:8889"
      - "8890:8890"
    volumes:
      - ./sekai_bridge/config3.yml:/app/config.yml
      - ./sekai_bridge/key3.json:/app/key.json

  sai-eth-indexer:
    build:
      context: ./saiEthIndexer
      dockerfile: Dockerfile
    ports:
      - "8881:8881"
    volumes:
      - ./saiEthIndexer/block.data:/srv/block.data
      - ./saiEthIndexer/config.json:/srv/config.json
      - ./saiEthIndexer/contracts.json:/srv/contracts.json

  sai-eth-interaction:
    build:
      context: ./saiETHContractInteraction
      dockerfile: Dockerfile
    ports:
      - "8882:8882"
    volumes:
      - ./saiETHContractInteraction/config.yml:/srv/config.yml

  sai-cosmos-indexer:
    build:
      context: ./sai-cosmos-indexer
      dockerfile: Dockerfile
    ports:
      - "8883:8883"
    volumes:
      - ./sai-cosmos-indexer/config.yml:/srv/config.yml

  sai-cosmos-interaction:
    build:
      context: ./sai-cosmos-interaction
      dockerfile: Dockerfile
    ports:
      - "8884:8884"
    volumes:
      - ./sai-cosmos-interaction/config.yml:/srv/config.yml

  sai-storage:
    build:
      context: ./sai-storage-mongo
      dockerfile: Dockerfile
    ports:
      - 8880:8880
    depends_on:
      - mongo-db
    volumes:
      - ./sai-storage-mongo/config.yml:/srv/config.yml


  mongo-db:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: { }
